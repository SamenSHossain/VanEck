[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaneck"
version = "0.1.0"
description = "VanEck ETF allocation study: feasibility gates and locked allocation-rule tests"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=0.2.50",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.100"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-requests"]

[project.scripts]
vaneck = "vaneck.cli:main"

[tool.setuptools]
packages = ["vaneck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["data", "reports", "paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B006"]
ignore = ["E731", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["vaneck"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_incomplete_defs = false
